name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android Licenses
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Capacitor APK
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "الصراف الذكي" "com.alsarraf.smartexchange" --web-dir www
          npx cap add android
          npx cap copy android

          node -e '
            const fs = require("fs");
            const p = "android/build.gradle";
            if (fs.existsSync(p)) {
              let c = fs.readFileSync(p, "utf8");
              if (!c.includes("resolutionStrategy")) {
                c += `\nsubprojects {\n  configurations.all {\n    resolutionStrategy {\n      force "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"\n      force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22"\n      force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22"\n    }\n  }\n}\n`;
                fs.writeFileSync(p, c, "utf8");
              }
            }
          '

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-exchange-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
